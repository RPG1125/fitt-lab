<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087f75">
  <meta name="description" content="Un laboratorio interactivo para aprender a evaluar la condición física antes de prescribir ejercicio con FITT-VP.">
  <title>FITT Lab · Evalúa antes de prescribir</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23087f75'/%3E%3Cpath d='M10 34h10l6-16 11 30 6-14h11' fill='none' stroke='white' stroke-width='4'/%3E%3C/svg%3E">
  <style>
{{STYLES}}
</style>
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M2 12h5l3-8 5 16 3-8h4"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5v15M3 4c4-1 6 0 9 2 3-2 5-3 9-2v15c-4-1-6 0-9 2-3-2-5-3-9-2z"/></symbol>
    <symbol id="i-body" viewBox="0 0 24 24"><circle cx="12" cy="4" r="2"/><path d="M5 9h14M9 9l1 6-2 6m7-12-1 6 2 6m-6-6h4"/></symbol>
    <symbol id="i-strength" viewBox="0 0 24 24"><path d="M7 12h10M3 8v8m4-10v12m10-12v12m4-10v8M3 12h4m10 0h4"/></symbol>
    <symbol id="i-flex" viewBox="0 0 24 24"><circle cx="15" cy="4" r="2"/><path d="m13 8-3 5 7 7m-7-7-6 7m6-7 7-3 4 3M4 5v8h4"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 3 7v6c0 5 9 9 9 9s9-4 9-9V7zM8 12l3 3 5-6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/></symbol>
    <symbol id="i-award" viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="m8 14-2 8 6-3 6 3-2-8m-6-13 1 2 2 .3-1.5 1.5.4 2.2L10 7"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 9a9 9 0 1 1 0 8M4 3v6h6"/></symbol>
  </defs></svg>
  <header>
    <div class="header-inner">
      <div class="brand" aria-label="FITT Lab, laboratorio de prescripción">
        <div class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-pulse"/></svg></div>
        <div><div class="wordmark">FITT<span> / LAB</span></div><div class="brand-sub">LABORATORIO DE PRESCRIPCIÓN</div></div>
      </div>
      <nav class="header-tools" aria-label="Recursos de aprendizaje">
        <span class="pill offline-pill"><span class="dot"></span> Sin instalación</span>
        <button class="text-btn" id="atlas-button"><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg> Fichas de consulta</button>
        <button class="text-btn" id="guide-button">Guía de clase</button>
      </nav>
    </div>
  </header>
  <main class="container" id="main" tabindex="-1"></main>
  <dialog id="resource-dialog" aria-labelledby="modal-title">
    <div class="modal-head"><h2 id="modal-title"></h2><button class="close-btn" id="close-dialog" aria-label="Cerrar ventana">×</button></div>
    <div class="modal-body" id="modal-body"></div>
  </dialog>
  <noscript><p style="padding:30px">Este juego requiere JavaScript. Habilítalo en tu navegador para iniciar la actividad. No se necesita conexión a internet.</p></noscript>
  <script>
{{SCRIPTS}}
</script>
</body>
</html>
